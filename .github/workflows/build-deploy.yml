name: Pipeline - Painel AVA

on:
  push:
    branches:
      - main  # <-- Adicione isso para rodar automaticamente a cada push na main
  release:
    types: [published]
  workflow_dispatch:

env:
  MAIN_IMAGE: ctezlifrn/avapainel

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.MAIN_IMAGE }}:${{ github.event.release.tag_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish-docker
    permissions:
      contents: read
    runs-on: [self-hosted, runner-dead]
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.K8S_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar Chart do Helm
        run: |
          ssh root@${{ secrets.K8S_HOST }} "rm -rf /tmp/painel-chart"
          scp -r ./helm root@${{ secrets.K8S_HOST }}:/tmp/painel-chart

      - name: Executar Upgrade no Helm
        run: |
          ssh root@${{ secrets.K8S_HOST }} "
            helm upgrade --install painel /tmp/painel-chart \
              --namespace ava \
              --set image.repository=${{ vars.DOCKERHUB_HOST }}/${{ env.MAIN_IMAGE }} \
              --set image.tag=${{github.event.release.tag_name}}
          "